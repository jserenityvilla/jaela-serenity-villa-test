<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Housekeeping Configuration | Ja-Ela Serenity Villa</title>
    <link rel="stylesheet" href="../../assets/css/style-new.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <style>
        .hk-container { max-width:1100px; margin:35px auto; padding:20px; }
        .hk-tabs { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0; }
        .hk-tabs button, .hk-action { padding:11px 16px; border:0; border-radius:6px; cursor:pointer; }
        .hk-tabs button.active, .hk-action { background:#087e78; color:white; }
        .hk-panel { background:white; border:1px solid #ddd; border-radius:10px; padding:20px; margin-bottom:20px; }
        .hk-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
        .hk-form label { display:flex; flex-direction:column; gap:6px; font-weight:600; }
        .hk-form input, .hk-form select, .hk-form textarea { padding:10px; border:1px solid #ccc; border-radius:5px; width:100%; }
        .hk-form textarea { min-height:65px; }
        .hk-actions { display:flex; gap:10px; margin-top:15px; flex-wrap:wrap; }
        .hk-table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; margin-top:15px; }
        th,td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }
        .hk-status { margin:12px 0; padding:10px; background:#f2f6f6; }
        .hk-danger { background:#a93226; color:white; }
        .hk-secondary { background:#e8eeee; color:#203030; }
        @media(max-width:650px) { .hk-form { grid-template-columns:1fr; } }
    </style>
</head>
<body data-admin-login-path="../login.html" style="visibility:hidden;">
<header><h1>Ja-Ela Serenity Villa</h1></header>
<main class="hk-container">
    <h1>Housekeeping Configuration</h1>
    <p>Manage rooms, linen and towel inventory, and guest pack rules.</p>

    <nav class="hk-tabs">
        <button type="button" data-tab="rooms" class="active">Rooms</button>
        <button type="button" data-tab="items">Linen &amp; Towels</button>
        <button type="button" data-tab="rules">Pack Rules</button>
    </nav>

    <div class="hk-panel">
        <h2 id="sectionTitle">Room Configuration</h2>
        <p id="sectionDescription">Manage bedrooms, floors and bed arrangements.</p>
        <div class="hk-actions">
            <button type="button" class="hk-action" id="seedDefaults">Load Initial Property Setup</button>
            <button type="button" class="hk-action hk-secondary" id="newRecord">Add New Record</button>
        </div>
        <div class="hk-status" id="statusMessage" role="status">Connecting to local database...</div>
    </div>

    <section class="hk-panel" id="editor" hidden>
        <h2 id="formTitle">Add Record</h2>
        <form id="recordForm">
            <div class="hk-form" id="formFields"></div>
            <div class="hk-actions">
                <button class="hk-action" type="submit">Save Record</button>
                <button class="hk-action hk-secondary" type="button" id="cancelEdit">Cancel</button>
            </div>
        </form>
    </section>

    <section class="hk-panel">
        <div class="hk-table-wrap">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </section>

    <a href="index.html">← Back to Linen &amp; Laundry Management</a>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../../firebase/firebase-config.js"></script>
<script src="../../assets/js/admin-auth-guard.js"></script>
<script src="../../assets/js/housekeeping-config.js"></script>
</body>
</html>
